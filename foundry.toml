[profile.default]
src = "T-REX/contracts"
test = "test"
out = "out"
libs = ["T-REX/node_modules"]
solc_version = "0.8.17"
evm_version = "london"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/=T-REX/node_modules/@openzeppelin/",
  "@onchain-id/=T-REX/node_modules/@onchain-id/",
]
